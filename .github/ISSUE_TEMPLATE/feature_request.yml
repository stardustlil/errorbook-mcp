name: Feature request
description: Propose a focused improvement to Errorbook MCP.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow is difficult or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired user-visible result, not only an implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or other designs you evaluated.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note changes to data, MCP schemas, scheduling, transports, or PDF output.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: I removed all personal data and real question content.
          required: true
