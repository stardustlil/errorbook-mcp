name: Bug report
description: Report a reproducible problem in Errorbook MCP.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove real questions, database contents, local paths, tokens, and other
        personal information before submitting this report.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that consistently reproduces the issue.
      placeholder: |
        1. Configure ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Errorbook MCP version
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - streamable HTTP
        - both
        - unknown
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version, MCP client, and browser.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste relevant logs after removing question content and personal data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed all personal data and real question content.
          required: true
        - label: This is not a security vulnerability.
          required: true
